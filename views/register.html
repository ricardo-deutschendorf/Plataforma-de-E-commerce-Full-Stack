<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | Pasteboard</title>
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <main class="auth-shell">
      <div class="auth-visual" aria-hidden="true"><span class="auth-orbit"></span><strong>MAKE<br>ROOM<br>FOR <i>MORE</i></strong><small>PASTEBOARD / 001</small></div>
      <section class="auth-card">
        <a class="auth-brand" href="/"><span class="brand-mark">P</span> PASTEBOARD</a>
        <p class="eyebrow">COMECE POR AQUI</p>
        <h1>Criar conta</h1>
        <p class="subtitle">Crie seu espaço para guardar o que importa.</p>
        <form id="authForm">
          <label>Nome completo <input id="name" required minlength="2" maxlength="80" autocomplete="name" placeholder="Digite seu nome completo"></label>
          <label>E-mail <input id="email" type="email" required maxlength="254" autocomplete="email" placeholder="nome@email.com"></label>
          <label>Senha <input id="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></label>
          <p class="form-error" id="authError" role="alert"></p>
          <button class="button button-primary auth-submit" type="submit">Criar conta</button>
        </form>
        <p class="auth-link">Já tem uma conta? <a href="/login">Entrar</a></p>
      </section>
    </main>
    <script src="/auth.js"></script>
  </body>
</html>
